# Disalin ke /etc/nginx/sites-available/ di VPS. Sertifikat HTTPS ditambahkan certbot.
#   skripsi-danur...      : aplikasi web (admin dan petani)
#   api.skripsi-danur...  : hanya API untuk aplikasi Flutter

server {
    listen 80;
    server_name skripsi-danur.synvorateknologiindonesia.web.id;

    # Unggahan dataset admin bisa sampai 20 foto sekaligus.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}

server {
    listen 80;
    server_name api.skripsi-danur.synvorateknologiindonesia.web.id;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /up {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Halaman web tidak dilayani dari domain API.
    location / {
        default_type application/json;
        return 404 '{"message":"Alamat tidak ditemukan."}';
    }
}
